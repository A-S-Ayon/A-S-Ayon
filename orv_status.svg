<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #0b1220; stroke: #334155; stroke-width: 1; }
      .header { fill: #111827; stroke: #334155; stroke-width: 1; }
      .title { fill: #e2e8f0; font: 600 16px 'Inter', 'Segoe UI', sans-serif; letter-spacing: 1px; }
      .label { fill: #94a3b8; font: 600 11px 'JetBrains Mono', 'Fira Code', monospace; letter-spacing: 0.8px; }
      .value { fill: #e2e8f0; font: 12px 'JetBrains Mono', 'Fira Code', monospace; }
      .muted { fill: #64748b; font: 11px 'JetBrains Mono', 'Fira Code', monospace; }
      .divider { stroke: #334155; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="680" height="420" />
  <rect class="panel" x="16" y="16" width="648" height="388" rx="6" />
  <rect class="header" x="16" y="16" width="648" height="44" rx="6" />

  <text class="title" x="40" y="44">CHARACTER PROFILE</text>
  <line class="divider" x1="16" y1="72" x2="664" y2="72" />

  <text class="label" x="40" y="96">NAME</text>
  <text class="value" x="180" y="96">A.S. AYON</text>

  <text class="label" x="40" y="122">SUPPORTING CONSTELLATION</text>
  <text class="value" x="260" y="122">THE MOST ANCIENT DREAM</text>
  <text class="muted" x="260" y="140">(TWO CONSTELLATIONS ARE CURRENTLY INTERESTED)</text>

  <line class="divider" x1="40" y1="154" x2="640" y2="154" />

  <text class="label" x="40" y="176">PERSONAL ATTRIBUTE</text>
  <text class="value" x="260" y="176">JACK OF ALL TRADES (RARE)</text>

  <line class="divider" x1="40" y1="192" x2="640" y2="192" />

  <text class="label" x="40" y="214">PERSONAL SKILLS</text>
  <text class="value" x="260" y="214">AUTOMATION &amp; WEB SCRAPING · LV. 4</text>
  <text class="value" x="260" y="232">MACHINE LEARNING · LV. 3</text>
  <text class="value" x="260" y="250">SYSTEMS THINKING · LV. 5</text>
  <text class="value" x="260" y="268">RAPID PROTOTYPING · LV. 4</text>

  <line class="divider" x1="40" y1="306" x2="640" y2="306" />

  <text class="label" x="40" y="328">OVERALL STATS</text>
  <text class="value" x="260" y="328">STAMINA 7 · STRENGTH 5 · AGILITY 8 · MANA 10</text>

  <line class="divider" x1="40" y1="344" x2="640" y2="344" />

  <text class="label" x="40" y="366">GENERAL EVALUATION</text>
  <text class="value" x="260" y="366">AN OBSERVER OF A WORLD NEVER MEANT TO BE UNDERSTOOD.</text>
  <text class="value" x="260" y="384">WILL THEY SURVIVE TO SEE THE FINAL EPISODE?</text>
</svg>
