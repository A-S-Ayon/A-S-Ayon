<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 860 240">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #0b1220; stroke: #334155; stroke-width: 1; }
      .header { fill: #111827; stroke: #334155; stroke-width: 1; }
      .title { fill: #e2e8f0; font: 600 14px 'Inter', 'Segoe UI', sans-serif; letter-spacing: 1px; }
      .label { fill: #94a3b8; font: 12px 'JetBrains Mono', 'Fira Code', monospace; }
      .value { fill: #e2e8f0; font: 12px 'JetBrains Mono', 'Fira Code', monospace; }
      .muted { fill: #64748b; font: 11px 'JetBrains Mono', 'Fira Code', monospace; }
      .divider { stroke: #334155; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="860" height="240" />
  <rect class="panel" x="16" y="16" width="828" height="208" rx="6" />
  <rect class="header" x="16" y="16" width="828" height="44" rx="6" />

  <text class="title" x="40" y="44">ONGOING SCENARIO</text>
  <line class="divider" x1="16" y1="72" x2="844" y2="72" />

  <text class="label" x="40" y="100">LEARNING</text>
  <text class="value" x="180" y="100">Automation &amp; Web Scraping</text>

  <text class="label" x="40" y="126">BUILDING</text>
  <text class="value" x="180" y="126">Anime Chatbot</text>

  <text class="label" x="40" y="152">READING</text>
  <text class="value" x="180" y="152">AI Research Papers, Lord of the Mysteries</text>

  <text class="label" x="40" y="178">GOAL</text>
  <text class="value" x="180" y="178">Explore, Create</text>

  <line class="divider" x1="40" y1="190" x2="820" y2="190" />

  <text class="muted" x="40" y="212">“This is not the end of the story. There are still episodes left to write.”</text>
</svg>
