<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 860 320">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #0b1220; stroke: #334155; stroke-width: 1; }
      .header { fill: #111827; stroke: #334155; stroke-width: 1; }
      .title { fill: #e2e8f0; font: 600 15px 'Inter', 'Segoe UI', sans-serif; letter-spacing: 1px; }
      .value { fill: #e2e8f0; font: 12px 'JetBrains Mono', 'Fira Code', monospace; }
      .muted { fill: #94a3b8; font: 12px 'JetBrains Mono', 'Fira Code', monospace; }
      .status-ok { fill: #22c55e; font: 12px 'JetBrains Mono', 'Fira Code', monospace; }
      .status-active { fill: #38bdf8; font: 12px 'JetBrains Mono', 'Fira Code', monospace; }
      .divider { stroke: #334155; stroke-width: 1; }
      .final { fill: #e2e8f0; font: 600 14px 'JetBrains Mono', 'Fira Code', monospace; letter-spacing: 1px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="860" height="320" />
  <rect class="panel" x="16" y="16" width="828" height="288" rx="6" />
  <rect class="header" x="16" y="16" width="828" height="44" rx="6" />

  <text class="title" x="40" y="44">SYSTEM INITIALIZATION</text>
  <line class="divider" x1="16" y1="72" x2="844" y2="72" />

  <text class="muted" x="40" y="98">• Establishing connection to the Akashic Records…</text>
  <text class="value" x="40" y="120">• Connection established</text>
  <text class="status-ok" x="330" y="120">[OK]</text>

  <text class="muted" x="40" y="144">• Detecting active scenario…</text>
  <text class="value" x="40" y="166">• Scenario detected</text>
  <text class="status-active" x="280" y="166">[ACTIVE]</text>

  <text class="muted" x="40" y="190">• Locating player entity…</text>
  <text class="value" x="40" y="212">• Entity confirmed</text>
  <text class="status-ok" x="270" y="212">[FOUND]</text>

  <text class="muted" x="40" y="236">• Loading character data…</text>

  <line class="divider" x1="40" y1="252" x2="820" y2="252" />

  <text class="final" x="40" y="278">PROFILE INITIALIZATION COMPLETE</text>
  <text class="muted" x="40" y="298">Two constellations are watching.</text>
</svg>
